# factory per-project config (/factory:init writes it; commit it).
# Commands run from the repository root with CI=true. Quote a value that contains ": " or " #".
# During a run this file is frozen with the tests: the check commands come from a snapshot taken at the
# freeze, so editing it mid-run changes nothing until the next run.

project:
  default_branch: main
  # $FACTORY_PORT is a free port derived from the run's slug, so parallel runs (claude --worktree) never
  # share a dev server. Pass it to your Playwright webServer too (see templates/playwright.demo.config.ts).
  start: "PORT=$FACTORY_PORT npm run dev"
  url: "http://localhost:$FACTORY_PORT"
  ready: /health            # path polled until the app answers; "" to skip

checks:
  # Every check writes JUnit XML into $FACTORY_REPORTS: contract-sync maps it to acceptance criteria.
  # Tag tests with @AC-<n> in the test title, or AC_<n> in a function name where the language has no
  # free-text titles (Go: TestAC_1_Toggle, Swift: test_AC_1_toggle).
  # Examples: vitest --reporter=junit --outputFile=$FACTORY_REPORTS/unit.xml · jest (jest-junit) ·
  # playwright --reporter=junit (PLAYWRIGHT_JUNIT_OUTPUT_FILE is set) · gotestsum --junitfile
  # $FACTORY_REPORTS/unit.xml · swift test --xunit-output $FACTORY_REPORTS/unit.xml · pytest --junitxml=...
  fast:                     # SubagentStop runs these after every implementer turn (900 s hook timeout)
    lint: npm run lint
    typecheck: npm run typecheck
    unit: "npx vitest run --reporter=junit --outputFile=$FACTORY_REPORTS/unit.xml"
  slow:                     # the orchestrator runs these after the implementer stops
    integration: ""
    e2e: "npx playwright test --reporter=junit"
  # Files that define what "the checks" are, frozen with the tests (globs; a name without / matches at
  # any depth). Omit the key to use factory's defaults for npm, Go, Swift, Python, Rust and Ruby.
  check_defining:
    - package.json
    - package-lock.json
    - "vitest.config.*"
    - "vite.config.*"
    - "playwright.config.*"
    - "tsconfig*.json"
    - "eslint.config.*"
    - ".prettierrc*"
    - ".github/workflows/*"
  stop_retries: 3

roles: {}                   # per-agent overrides, e.g.:
#  implementer: {model: sonnet, effort: medium}   only after /factory:stats shows parity
#  reviewer-security: {model: fable, effort: high}   Fable 5.1 is not available under zero data retention

limits:
  prd_rounds: 3
  review_rounds: 2
  evidence_rounds: 3
  depth: auto               # lite | full | auto (lite when the diff is small and touches nothing on the risk list)
  lite_max_lines: 150
  budget_usd: 60            # pause at the next gate when the run's estimated spend passes this

risk_list: [auth, payments, personal-data, crypto, migrations, public-api, concurrency, dependencies]

evidence:
  driver: playwright        # playwright | command | none (none: the review pack has test results only)
  capture: ""               # with driver: command, a command that writes screenshots into $FACTORY_EVIDENCE
  viewports: [1440x900, 768x1024, 390x844]
  publish: ""               # optional command that uploads review-pack/ and prints a URL

ship:
  pr_open: "gh pr create --draft --fill"
  pr_ready: "gh pr ready"
  merge: "gh pr merge --squash"
  deploy: ""                # e.g. "make deploy-prod"; the guard blocks it outside an approved stage 7
  smoke: ""                 # e.g. "BASE_URL=https://example.com npx playwright test --grep @smoke"
  rollback: ""              # e.g. "make rollback-prod"

monitor:
  window_hours: 24
  scheduler: local-loop     # local-loop | launchd | github-actions
  interval: 15m
  report: file              # file (.factory/incidents/) | github-issue (label factory-incident)
  auto_rollback: false
  checks:
    - name: health
      cmd: "curl -fsS https://example.com/health"

learning:
  enabled: true
  compound_depth: full
  refresh_ceiling: 25
  memory_max_lines: 150
  rubric_visible: false
